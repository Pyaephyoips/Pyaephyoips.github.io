<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Dashboard</title>
  <link rel="stylesheet" href="assets/odoo-dashboard.css">
</head>
<body>
<header class="dash-header">
  <h1>📈 Sales Dashboard</h1>
  <nav class="dash-nav">
    <a href="index.html">← Home</a>
    <a href="executive-dashboard.html">Executive</a>
    <a href="sales-dashboard.html" class="active">Sales</a>
    <a href="financial-dashboard.html">B&amp;S / P&amp;L</a>
    <a href="inventory-dashboard.html">Inventory</a>
    <a href="purchase-dashboard.html">Purchase</a>
    <a href="manufacturing-dashboard.html">Manufacturing</a>
  </nav>
</header>

<div class="dash-main">
  <div class="setup-note" id="setupNote" style="display:none"></div>
  <div class="state-banner" id="stateBanner" style="display:none"></div>

  <div class="controls">
    <span style="font-size:.85rem;color:var(--muted)">Period:</span>
    <button class="period-btn" data-m="3" onclick="setPeriod(3,this)">3 Months</button>
    <button class="period-btn" data-m="6" onclick="setPeriod(6,this)">6 Months</button>
    <button class="period-btn active" data-m="12" onclick="setPeriod(12,this)">12 Months</button>
    <button class="period-btn" data-m="24" onclick="setPeriod(24,this)">24 Months</button>
    <div class="date-range">
      <input type="date" id="dateFrom">
      <span style="color:var(--muted);font-size:.8rem">to</span>
      <input type="date" id="dateTo">
      <button class="btn-apply-range" onclick="applyCustomRange()">Apply</button>
    </div>
    <div id="companySwitcher"></div>
    <button class="btn-refresh" onclick="exportExcel()">⬇ Excel</button>
    <button class="btn-refresh" onclick="window.print()">🖨 PDF</button>
    <button class="btn-refresh" onclick="load()">↻ Refresh</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="chart-area">
    <h3>Sales Trend</h3>
    <svg class="trend" id="trendChart"></svg>
  </div>

  <div class="two-col">
    <div class="section-card">
      <div class="section-header"><h3>🗂 Sales by Product Category</h3></div>
      <div id="byCategory"></div>
    </div>
    <div class="section-card">
      <div class="section-header"><h3>👤 Top Customers</h3></div>
      <div id="topCustomers"></div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>🏆 Top Products</h3></div>
    <table>
      <thead><tr><th>Product</th><th>Category</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
      <tbody id="topProductsBody"></tbody>
    </table>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>🧑‍💼 Sales by Salesperson</h3></div>
    <table>
      <thead><tr><th>Salesperson</th><th class="num">Orders</th><th class="num">Total Sales</th></tr></thead>
      <tbody id="salespersonBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/odoo-client.js?v=10"></script>
<script src="assets/odoo-dashboard.js?v=10"></script>
<script>
let months = 12;
let customRange = null;
let lastData = null;

function setPeriod(m, btn) {
  months = m;
  customRange = null;
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

function applyCustomRange() {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (!from || !to) { alert('Please pick both a start and end date.'); return; }
  customRange = { date_from: from, date_to: to };
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  load();
}

async function load() {
  if (!odooConfigured()) {
    renderSetupNote('setupNote');
    showState('stateBanner', null);
    return;
  }
  document.getElementById('setupNote').style.display = 'none';
  showState('stateBanner', 'loading', 'Loading sales data from Odoo…');
  try {
    const data = await fetchOdooReport('/api/sales', customRange || { months });
    showState('stateBanner', null);
    lastData = data;
    render(data);
  } catch (err) {
    showState('stateBanner', 'error', err.message);
  }
}

function render(data) {
  const k = data.kpis;
  renderKpis('kpiRow', [
    { label: 'Total Sales', value: fmtMoney(k.total_sales), cls: 'pos' },
    { label: 'Orders', value: fmtInt(k.order_count) },
    { label: 'Avg Order Value', value: fmtMoney(k.avg_order_value) },
    { label: 'Pending Quotations', value: fmtInt(k.pending_quotations), cls: 'warn' },
  ]);

  renderTrendChart('trendChart', data.monthly_trend.map(r => ({ label: r.month.split(' ')[0].slice(0,3), value: r.total })));

  renderRankBars('byCategory', (data.by_category || []).map(c => ({ label: c.category, value: c.total })), { prefix: '' });
  renderRankBars('topCustomers', data.top_customers.map(c => ({ label: c.customer, value: c.total })), { prefix: '' });

  renderTable('topProductsBody', data.top_products, r => `
    <tr>
      <td>${r.product}</td>
      <td>${r.category || ''}</td>
      <td class="num">${fmtInt(r.qty)}</td>
      <td class="num">${fmtMoney(r.total)}</td>
    </tr>
  `, 4);

  renderTable('salespersonBody', data.by_salesperson, r => `
    <tr>
      <td>${r.salesperson}</td>
      <td class="num">${fmtInt(r.count)}</td>
      <td class="num">${fmtMoney(r.total)}</td>
    </tr>
  `, 3);
}

function exportExcel() {
  if (!lastData) { alert('Load the dashboard data first.'); return; }
  const d = lastData;
  exportToExcel(exportFilename('sales-dashboard'), [
    {
      name: 'Summary',
      headers: ['Metric', 'Value'],
      rows: [
        ['Total Sales', d.kpis.total_sales],
        ['Orders', d.kpis.order_count],
        ['Avg Order Value', d.kpis.avg_order_value],
        ['Pending Quotations', d.kpis.pending_quotations],
      ],
    },
    {
      name: 'Monthly Trend',
      headers: ['Month', 'Total'],
      rows: d.monthly_trend.map(r => [r.month, r.total]),
    },
    {
      name: 'By Category',
      headers: ['Category', 'Total'],
      rows: (d.by_category || []).map(c => [c.category, c.total]),
    },
    {
      name: 'Top Products',
      headers: ['Product', 'Category', 'Qty', 'Total'],
      rows: d.top_products.map(r => [r.product, r.category || '', r.qty, r.total]),
    },
    {
      name: 'Top Customers',
      headers: ['Customer', 'Total'],
      rows: d.top_customers.map(c => [c.customer, c.total]),
    },
    {
      name: 'By Salesperson',
      headers: ['Salesperson', 'Orders', 'Total Sales'],
      rows: d.by_salesperson.map(r => [r.salesperson, r.count, r.total]),
    },
  ]);
}

load();
renderCompanySwitcher('companySwitcher');
</script>
</body>
</html>
