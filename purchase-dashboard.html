<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase Dashboard</title>
  <link rel="stylesheet" href="assets/odoo-dashboard.css">
</head>
<body>
<header class="dash-header">
  <h1>🛒 Purchase Dashboard</h1>
  <nav class="dash-nav">
    <a href="index.html">← Home</a>
    <a href="executive-dashboard.html">Executive</a>
    <a href="sales-dashboard.html">Sales</a>
    <a href="financial-dashboard.html">B&amp;S / P&amp;L</a>
    <a href="inventory-dashboard.html">Inventory</a>
    <a href="purchase-dashboard.html" class="active">Purchase</a>
    <a href="manufacturing-dashboard.html">Manufacturing</a>
  </nav>
</header>

<div class="dash-main">
  <div class="setup-note" id="setupNote" style="display:none"></div>
  <div class="state-banner" id="stateBanner" style="display:none"></div>

  <div class="controls">
    <span style="font-size:.85rem;color:var(--muted)">Period:</span>
    <button class="period-btn" data-m="3" onclick="setPeriod(3,this)">3 Months</button>
    <button class="period-btn" data-m="6" onclick="setPeriod(6,this)">6 Months</button>
    <button class="period-btn active" data-m="12" onclick="setPeriod(12,this)">12 Months</button>
    <button class="period-btn" data-m="24" onclick="setPeriod(24,this)">24 Months</button>
    <button class="btn-refresh" onclick="load()">↻ Refresh</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="chart-area">
    <h3>Purchase Spend Trend</h3>
    <svg class="trend" id="trendChart"></svg>
  </div>

  <div class="two-col">
    <div class="section-card">
      <div class="section-header"><h3>🏭 Top Suppliers</h3></div>
      <div id="topSuppliers"></div>
    </div>
    <div class="section-card">
      <div class="section-header"><h3>📦 Top Purchased Products</h3></div>
      <div id="topProducts"></div>
    </div>
  </div>
</div>

<script src="assets/odoo-client.js?v=6"></script>
<script src="assets/odoo-dashboard.js?v=6"></script>
<script>
let months = 12;

function setPeriod(m, btn) {
  months = m;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

async function load() {
  if (!odooConfigured()) {
    renderSetupNote('setupNote');
    showState('stateBanner', null);
    return;
  }
  document.getElementById('setupNote').style.display = 'none';
  showState('stateBanner', 'loading', 'Loading purchase data from Odoo…');
  try {
    const data = await fetchOdooReport('/api/purchase', { months });
    showState('stateBanner', null);
    render(data);
  } catch (err) {
    showState('stateBanner', 'error', err.message);
  }
}

function render(data) {
  const k = data.kpis;
  renderKpis('kpiRow', [
    { label: 'Total Spend', value: fmtMoney(k.total_spend), cls: 'neg' },
    { label: 'Orders', value: fmtInt(k.order_count) },
    { label: 'Avg Order Value', value: fmtMoney(k.avg_order_value) },
    { label: 'Pending Orders', value: fmtInt(k.pending_orders), cls: 'warn' },
  ]);

  renderTrendChart('trendChart', data.monthly_trend.map(r => ({ label: r.month.split(' ')[0].slice(0,3), value: r.total })), { color: '#f97316' });

  renderRankBars('topSuppliers', data.top_suppliers.map(s => ({ label: s.supplier, value: s.total })));
  renderRankBars('topProducts', data.top_products.map(p => ({ label: p.product, value: p.total })));
}

load();
</script>
</body>
</html>
